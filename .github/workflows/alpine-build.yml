name: Build and test Alpine web server

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t alpine-web:ci .

      - name: Test web server
        run: |
          docker run --rm -d --name alpine-web-ci -p 127.0.0.1:8080:8080 alpine-web:ci
          trap 'docker stop alpine-web-ci' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused \
            http://localhost:8080 | grep -F "OpenShift Learning Lab"
